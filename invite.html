<title>Table and the City – you’re invited</title>
<!-- Short "Want to go with…" links (js/features.js inviteUrl): /invite?<city>/<id>/<FirstName>[&<lang>]  ·  /invite?<country>/<city>/<id>/<FirstName>
     GitHub Pages serves /invite from this file. It forwards at once to the place page (restaurant.html?…&invite=1&from=…), which shows the invite card;
     anything that does not parse goes to the homepage. Spaces may come as + or %20; names are cleaned like the place page does. -->
<script>
(function () {
  var home = './', to = home;
  try {
    var q = location.search.replace(/^\?/, '').split('&'), p = q.shift().split('/'), lang = '';
    q.forEach(function (t) { t = t.toLowerCase().replace(/^lang=/, ''); if (/^(en|nl|de|fr|es)$/.test(t)) lang = t; });
    var d = function (v) { return decodeURIComponent(String(v || '').replace(/\+/g, ' ')); };
    if (p.length === 2) p.push('');                      // no name
    if (p.length === 3) p.unshift('be');                 // Belgium needs no country
    if (p.length === 4) {
      var co = d(p[0]).toLowerCase(), city = d(p[1]).toLowerCase(), id = d(p[2]).toLowerCase(),
          from = Array.from(d(p[3]).normalize('NFC').replace(/[^\p{L}\p{M}\p{N} .'’-]+/gu, ' ').replace(/\s+/g, ' ').trim()).slice(0, 30).join('').trim();
      if (/^[a-z]{2}$/.test(co) && /^[a-z0-9-]{1,60}$/.test(city) && /^[a-z0-9-]{1,120}$/.test(id)) {
        var s = 'country=' + co + '&city=' + city + '&id=' + encodeURIComponent(id) + '&invite=1' + (from ? '&from=' + encodeURIComponent(from) : '') + (lang ? '&lang=' + lang : '');
        to = 'restaurant.html?' + s;
      }
    }
  } catch (e) { to = home; }
  location.replace(to);
  document.addEventListener('DOMContentLoaded', function () { var a = document.getElementById('go'); if (a) a.href = to; });
})();
</script>
